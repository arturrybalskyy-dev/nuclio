# FORK-ONLY TEST STUB - never merge upstream.
# Replaces the real CI so Dependabot Auto-Merge can be tested in minutes:
#   - waits 90s, so the PR can be changed while "CI" runs,
#   - fails if the PR contains .github/fail-ci.
name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - development
      - "[0-9]+.[0-9]+.x"

jobs:
  stub:
    name: CI stub for auto-merge testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wait, to allow changing the PR while "CI" runs
        run: sleep 90

      - name: Fail if requested by the PR
        run: test ! -f .github/fail-ci
